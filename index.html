<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Slice It All Carter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#8fd3ff;user-select:none;-webkit-user-select:none;touch-action:none;
    font-family:'Lilita One',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
  canvas{display:block}
  .stroke{color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.25),2px 0 0 #23305a,-2px 0 0 #23305a,0 2px 0 #23305a,0 -2px 0 #23305a}
  #top{position:fixed;top:16px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;font-size:20px;pointer-events:none}
  .lvl{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;border:3px solid #fff;font-size:18px}
  .lvl.cur{background:#ff5e8a}.lvl.nxt{background:#9aa6c4}
  #bar{width:min(48vw,280px);height:14px;background:rgba(255,255,255,.45);border-radius:10px;overflow:hidden;border:3px solid #fff}
  #fill{height:100%;width:0;background:linear-gradient(90deg,#ffd23f,#ff8a3d);transition:width .1s}
  #coins{position:fixed;top:18px;right:16px;font-size:26px;display:flex;align-items:center;gap:8px;pointer-events:none}
  #coins i{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff6a8,#ffc21a 55%,#e09200);border:2px solid #b87400;display:inline-block}
  #lc{position:fixed;top:60px;right:16px;font-size:18px;pointer-events:none;opacity:.9}
  #overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;text-align:center;padding:0 16px}
  #overlay.dim{background:rgba(20,30,70,.35)}
  .big{font-size:clamp(40px,10vw,84px);line-height:1}
  .mid{font-size:clamp(22px,5vw,36px);margin-top:10px}
  .hint{font-size:clamp(18px,4vw,26px);margin-top:28px;animation:pulse 1s ease-in-out infinite}
  @keyframes pulse{50%{transform:scale(1.08);opacity:.75}}
  .pop{position:fixed;font-size:30px;pointer-events:none;animation:up .8s ease-out forwards;transform:translate(-50%,-50%)}
  @keyframes up{to{transform:translate(-50%,-160%) scale(1.3);opacity:0}}
  .hand{font-size:54px;margin-top:18px;animation:tap 1s ease-in-out infinite}
  @keyframes tap{50%{transform:translateY(10px) scale(.9)}}
</style>
</head>
<body>
<div id="top" class="stroke"><div class="lvl cur" id="l1">1</div><div id="bar"><div id="fill"></div></div><div class="lvl nxt" id="l2">2</div></div>
<div id="coins" class="stroke"><i></i><span id="ct">0</span></div>
<div id="lc" class="stroke"></div>
<div id="overlay" class="stroke"></div>

// ---------- tuning ----------
const G = -26, JUMP_VY = 9.2, JUMP_VX = 4.1, SPIN = -17, BASE_SPIN = -3.2;
const TIP = {x:-0.06, y:1.12}, HE = {x:0, y:-0.92};
const PLAT_D = 3.6, PLAT_H = 8;
const STEP = 1/240, STICK_DEPTH = 0.14, MAX_TILT = 0.42;
const COLORS = [0xff8fb1, 0x8fd0ff, 0xb69cff, 0x7fe0b0, 0xffc96e];

// ---------- renderer / scene ----------
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = (() => {
  const c = document.createElement('canvas'); c.width = 2; c.height = 256;
  const g = c.getContext('2d'), gr = g.createLinearGradient(0,0,0,256);
  gr.addColorStop(0,'#5ab8ff'); gr.addColorStop(0.6,'#bfe6ff'); gr.addColorStop(1,'#e8f7ff');
  g.fillStyle = gr; g.fillRect(0,0,2,256);
  return new THREE.CanvasTexture(c);
})();
scene.fog = new THREE.Fog(0xcdeeff, 28, 70);

const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 200);
scene.add(new THREE.HemisphereLight(0xffffff, 0x9bb4d6, 0.6));
const sun = new THREE.DirectionalLight(0xffffff, 0.75);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, {left:-14, right:14, top:14, bottom:-14, near:1, far:60});
scene.add(sun, sun.target);

const water = new THREE.Mesh(new THREE.PlaneGeometry(800, 200), new THREE.MeshLambertMaterial({color:0x7cc8f0}));
water.rotation.x = -Math.PI/2; water.position.y = -14; scene.add(water);

function resize(){
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

// ---------- materials ----------
const photoTex = new THREE.TextureLoader().load(PHOTO);
const P = new THREE.MeshLambertMaterial({map:photoTex});
const CUT = new THREE.MeshLambertMaterial({color:0xffb98a, side:THREE.DoubleSide});
const STEEL = new THREE.MeshPhongMaterial({color:0x5b6272, shininess:80, specular:0x99aabb});

function labelTex(text, bg, size){
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  g.fillStyle = bg; g.fillRect(0,0,256,256);
  g.font = `${size||120}px 'Lilita One', sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.lineWidth = 12; g.strokeStyle = 'rgba(0,0,0,.35)'; g.strokeText(text,128,136);
  g.fillStyle = '#fff'; g.fillText(text,128,136);
  const t = new THREE.CanvasTexture(c); t.anisotropy = 4; return t;
}
function checkerTex(){
  const c = document.createElement('canvas'); c.width = 64; c.height = 256;
  const g = c.getContext('2d');
  for (let y=0;y<8;y++) for (let x=0;x<2;x++){ g.fillStyle = (x+y)%2 ? '#222' : '#fff'; g.fillRect(x*32,y*32,32,32); }
  return new THREE.CanvasTexture(c);
}

// ---------- knife ----------
const knifeMesh = (() => {
  const grp = new THREE.Group();
  const s = new THREE.Shape();
  s.moveTo(-0.11,-0.1); s.lineTo(0.14,-0.1); s.lineTo(0.14,0.55);
  s.quadraticCurveTo(0.13,0.95,-0.11,1.14); s.lineTo(-0.11,-0.1);
  const bg = new THREE.ExtrudeGeometry(s, {depth:0.04, bevelEnabled:true, bevelThickness:0.015, bevelSize:0.012, bevelSegments:1});
  bg.translate(0,0,-0.02);
  const blade = new THREE.Mesh(bg, new THREE.MeshPhongMaterial({color:0xe3e9f0, shininess:140, specular:0xffffff}));
  const guard = new THREE.Mesh(new THREE.BoxGeometry(0.42,0.08,0.16), new THREE.MeshPhongMaterial({color:0x3a3f4a, shininess:60}));
  guard.position.y = -0.13;
  const handle = new THREE.Mesh(new THREE.BoxGeometry(0.2,0.74,0.13), new THREE.MeshPhongMaterial({color:0xd8343f, shininess:30}));
  handle.position.y = -0.53;
  const pommel = new THREE.Mesh(new THREE.BoxGeometry(0.26,0.08,0.15), guard.material);
  pommel.position.y = -0.92;
  for (const m of [blade,guard,handle,pommel]) { m.castShadow = true; grp.add(m); }
  scene.add(grp);
  return grp;
})();

// blade swoosh trail: ribbon between the tip and the middle of the blade
const TRAIL_N = 22;
const trail = (() => {
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(TRAIL_N*2*3), 3));
  const alpha = new Float32Array(TRAIL_N*2);
  for (let i = 0; i < TRAIL_N; i++) alpha[i*2] = alpha[i*2+1] = Math.pow(i/(TRAIL_N-1), 1.6);
  geo.setAttribute('alpha', new THREE.BufferAttribute(alpha, 1));
  const idx = [];
  for (let i = 0; i < TRAIL_N-1; i++) { const a = i*2; idx.push(a, a+1, a+2, a+1, a+3, a+2); }
  geo.setIndex(idx);
  const mat = new THREE.ShaderMaterial({
    transparent:true, depthWrite:false, side:THREE.DoubleSide,
    vertexShader:'attribute float alpha; varying float vA; void main(){ vA = alpha; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
    fragmentShader:'uniform float op; varying float vA; void main(){ gl_FragColor = vec4(1.0,1.0,1.0,vA*0.5*op); }',
    uniforms:{op:{value:0}}
  });
  const m = new THREE.Mesh(geo, mat); m.frustumCulled = false; scene.add(m);
  return {m, geo, mat, pts:[]};
})();

// ---------- state ----------
let world = new THREE.Group(); scene.add(world);
let platforms = [], slices = [], obstacles = [], halves = [], parts = [];
let level = 1, totalCoins = 0, levelCoins = 0, finishX = 0, startX = 0;
let mode = 'menu';       // menu | play | fail | win
let shake = 0, shakeT = 0, camX = 0, camY = 0, winTimer = 0, lastMult = 1, hitCD = 0, acc = 0;
const K = {x:0, y:0, a:0, vx:0, vy:0, va:0, state:'stuck', stickT:9, wob:0};
try { level = +localStorage.getItem('sic_level') || 1; totalCoins = +localStorage.getItem('sic_coins') || 0; } catch(e) {}
function save(){ try { localStorage.setItem('sic_level', level); localStorage.setItem('sic_coins', totalCoins); } catch(e) {} }

let rng;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R = (a,b) => a + rng()*(b-a);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));

// ---------- level building ----------
function addPlatform(x0, x1, top, opt = {}){
  const h = opt.h || PLAT_H, w = x1 - x0;
  let mats;
  if (opt.mult) {
    const hue = 120 - (opt.idx/9)*120;
    const bg = `hsl(${hue},80%,55%)`, side = new THREE.MeshLambertMaterial({color:new THREE.Color(`hsl(${hue},70%,42%)`)});
    const lab = new THREE.MeshLambertMaterial({map:labelTex('x'+opt.mult, bg, opt.wall ? 90 : 120)});
    mats = opt.wall ? [side,side,side,side,lab,side] : [side,side,lab,side,lab,side];
  } else {
    const c = new THREE.Color(COLORS[opt.ci % COLORS.length]);
    const side = new THREE.MeshLambertMaterial({color:c.clone().multiplyScalar(0.82)});
    const topM = new THREE.MeshLambertMaterial({color:c.clone().lerp(new THREE.Color(0xffffff), 0.08)});
    mats = [side,side,topM,side,side,side];
  }
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, PLAT_D), mats);
  m.position.set((x0+x1)/2, top - h/2, 0);
  m.receiveShadow = true; m.castShadow = !!opt.wall;
  world.add(m);
  const p = {x0, x1, top, bot: top - h, mult: opt.mult || 0, wall: !!opt.wall};
  platforms.push(p);
  return p;
}

function addSlice(kind, x, y0, dims, supports, ground){
  let geo, w, h;
  if (kind === 'box') { geo = new THREE.BoxGeometry(dims.w, dims.h, dims.d); w = dims.w; h = dims.h; }
  else if (kind === 'cyl') { geo = new THREE.CylinderGeometry(dims.r, dims.r, dims.h, 32); w = dims.r*2; h = dims.h; }
  else { geo = new THREE.SphereGeometry(dims.r, 32, 20); w = h = dims.r*2; }
  const mesh = new THREE.Mesh(geo, P);
  mesh.castShadow = true;
  mesh.position.set(x, y0 + h/2, 0);
  world.add(mesh);
  const o = {kind, x, y0, w, h, dims, mesh, alive:true, vy:0, sq:0, supports:supports || [], ground};
  slices.push(o);
  return o;
}

// where an object rests: on its highest surviving support, else the platform
function floorOf(o){
  let f = o.ground;
  for (const s of o.supports) f = Math.max(f, s.alive ? s.y0 + s.h : floorOf(s));
  return f;
}

function populate(xs, xe, top, n){
  let px = xs + R(0, 0.5);
  while (true) {
    const r = rng();
    if (n >= 2 && r < 0.13) {
      const w = R(0.5,0.8), h = R(0.45,0.9);
      if (px + w > xe) break;
      const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, 1.4), STEEL);
      m.position.set(px + w/2, top + h/2, 0); m.castShadow = true; world.add(m);
      obstacles.push({x: px + w/2, y0: top, w, h, steel:true});
      px += w + R(1.2, 2);
      continue;
    }
    let w;
    if (r < 0.42) {
      // tower of boxes, sometimes crowned with a ball or a can
      w = R(0.75, 1.0);
      if (px + w > xe) break;
      const cnt = 2 + Math.floor(rng()*(1 + Math.min(n, 3)));
      let y = top, below = null;
      for (let i = 0; i < cnt; i++) {
        const h = R(0.5, 0.8);
        below = addSlice('box', px + w/2, y, {w:w*R(0.82, 1), h, d:R(1.1, 1.4)}, below ? [below] : [], top);
        y += h;
      }
      const c = rng();
      if (c < 0.35) addSlice('sph', px + w/2, y, {r:R(0.28, 0.4)}, [below], top);
      else if (c < 0.6) addSlice('cyl', px + w/2, y, {r:R(0.22, 0.32), h:R(0.5, 0.9)}, [below], top);
    } else if (r < 0.58) {
      // pyramid
      const bw = R(0.55, 0.65), rows = rng() < 0.55 ? 3 : 2;
      w = bw*rows;
      if (px + w > xe) break;
      let prev = [], y = top;
      for (let row = 0; row < rows; row++) {
        const h = R(0.48, 0.62), cur = [];
        for (let i = 0; i < rows - row; i++) {
          const cx = px + row*bw/2 + bw/2 + i*bw;
          cur.push(addSlice('box', cx, y, {w:bw*0.96, h, d:1.2}, row ? [prev[i], prev[i+1]] : [], top));
        }
        y += h; prev = cur;
      }
    } else if (r < 0.78) {
      // single tall piece
      if (rng() < 0.5) {
        w = R(0.7, 1.0);
        if (px + w > xe) break;
        addSlice('box', px + w/2, top, {w, h:R(1.2, 2.2), d:R(1.1, 1.4)}, [], top);
      } else {
        const rad = R(0.35, 0.55); w = rad*2;
        if (px + w > xe) break;
        addSlice('cyl', px + w/2, top, {r:rad, h:R(1.2, 2.6)}, [], top);
      }
    } else {
      // ball, often on a pedestal
      const rad = R(0.4, 0.6); w = rad*2;
      if (px + w > xe) break;
      if (rng() < 0.55) {
        const b = addSlice('box', px + w/2, top, {w, h:R(0.5, 0.9), d:1.2}, [], top);
        addSlice('sph', px + w/2, top + b.h, {r:rad}, [b], top);
      } else addSlice('sph', px + w/2, top, {r:rad}, [], top);
    }
    px += w + R(0.8, 1.7);
  }
}

function buildLevel(n){
  scene.remove(world);
  world.traverse(o => { if (o.geometry) o.geometry.dispose(); });
  world = new THREE.Group(); scene.add(world);
  platforms = []; slices = []; obstacles = []; halves = []; parts = [];
  rng = mulberry32(n * 7919 + 13);

  let top = 0, x = 6;
  addPlatform(-4, 6, 0, {ci:0});
  populate(2.2, 6, 0, n);
  const segs = Math.min(5 + n*2, 22);
  for (let i = 0; i < segs; i++) {
    const gap = R(1.3, 2.0 + Math.min(n*0.12, 1.3));
    const L = R(3, 7.5);
    const steps = [-0.8, 0, 0, 0, 0.7, 1.3];
    top = clamp(top + steps[Math.floor(rng()*steps.length)], -1.5, 2.5);
    const x0 = x + gap, x1 = x0 + L;
    addPlatform(x0, x1, top, {ci:i+1});
    populate(x0 + 0.9, x1 - 0.5, top, n);
    x = x1;
  }
  // finish: multiplier tiles + wall
  const fx0 = x + R(1.6, 2.1);
  const mults = [1,2,3,4,5,6,8,10,12,15];
  mults.forEach((m, i) => addPlatform(fx0 + i*1.5, fx0 + (i+1)*1.5, top, {mult:m, idx:i}));
  const wx = fx0 + mults.length*1.5;
  addPlatform(wx, wx + 2.5, top + 26, {mult:25, idx:9, wall:true, h:26 + PLAT_H});
  const fl = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.04, PLAT_D), new THREE.MeshLambertMaterial({map:checkerTex()}));
  fl.position.set(fx0 + 0.25, top + 0.021, 0); world.add(fl);
  finishX = fx0;

  // knife on start
  Object.assign(K, {x:0, y:0, a:Math.PI - 0.2, vx:0, vy:0, va:0, state:'stuck', stickT:9, wob:0});
  const t = wp(TIP.x, TIP.y);
  K.x += 0 - t[0]; K.y += -STICK_DEPTH - t[1];
  trail.pts.length = 0; acc = 0;
  startX = K.x; camX = K.x; camY = 0;
  levelCoins = 0;
  hud();
}

// ---------- helpers ----------
function wp(lx, ly){ const c = Math.cos(K.a), s = Math.sin(K.a); return [K.x + lx*c - ly*s, K.y + lx*s + ly*c]; }
function platHit(px, py){ for (const p of platforms) if (px >= p.x0 && px <= p.x1 && py < p.top && py > p.bot) return p; return null; }
function platAt(px){ for (const p of platforms) if (!p.wall && px >= p.x0 && px <= p.x1) return p; return null; }
function inBox(px, py, o){ return px > o.x - o.w/2 && px < o.x + o.w/2 && py > o.y0 && py < o.y0 + o.h; }

// ---------- audio ----------
let ac;
function au(){ if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {} } return ac; }
function tone(f1, f2, dur, type, vol){
  const a = au(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain(), t = a.currentTime;
  o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur);
}
function noise(dur, vol, freq){
  const a = au(); if (!a) return;
  const b = a.createBuffer(1, a.sampleRate*dur, a.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random()*2 - 1) * (1 - i/d.length);
  const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  s.buffer = b; f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = 0.8; g.gain.value = vol;
  s.connect(f).connect(g).connect(a.destination); s.start();
}
const sfx = {
  flip(){ noise(0.16, 0.25, 1800); },
  slice(){ noise(0.12, 0.5, 4200); tone(700, 1500, 0.1, 'triangle', 0.12); },
  stick(){ tone(220, 70, 0.14, 'square', 0.08); noise(0.06, 0.3, 600); },
  bonk(){ tone(160, 110, 0.12, 'sine', 0.3); },
  clang(){ tone(900, 600, 0.2, 'square', 0.06); },
  win(){ [523,659,784,1046].forEach((f,i) => setTimeout(() => tone(f, f, 0.18, 'triangle', 0.15), i*110)); },
  fail(){ tone(300, 90, 0.45, 'sawtooth', 0.08); }
};

// ---------- effects ----------
const tmpV = new THREE.Vector3();
function pop(x, y, text, color){
  tmpV.set(x, y, 0).project(camera);
  const d = document.createElement('div');
  d.className = 'pop stroke'; d.textContent = text;
  if (color) d.style.color = color;
  d.style.left = (tmpV.x*0.5 + 0.5)*innerWidth + 'px';
  d.style.top = (-tmpV.y*0.5 + 0.5)*innerHeight + 'px';
  document.body.appendChild(d);
  d.addEventListener('animationend', () => d.remove());
}
const partGeo = new THREE.BoxGeometry(0.11, 0.11, 0.11);
function burst(x, y){
  for (let i = 0; i < 10; i++) {
    const m = new THREE.Mesh(partGeo, i % 3 ? CUT : P);
    m.position.set(x, y, R(-0.3, 0.3)); world.add(m);
    parts.push({m, vx:R(-2,3), vy:R(1,5), vz:R(-3,3), life:0.7});
  }
}

function makeHalves(o){
  const cy = o.y0 + o.h/2;
  for (const side of [1, -1]) {
    const g = new THREE.Group();
    let lie;
    if (o.kind === 'box') {
      const mats = [P,P,P,P,P,P]; mats[side > 0 ? 5 : 4] = CUT;
      const m = new THREE.Mesh(new THREE.BoxGeometry(o.dims.w, o.dims.h, o.dims.d/2), mats);
      m.position.z = side*o.dims.d/4; m.castShadow = true; g.add(m);
      lie = o.dims.d/2;
    } else if (o.kind === 'cyl') {
      const r = o.dims.r;
      const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, o.h, 24, 1, false, side > 0 ? -Math.PI/2 : Math.PI/2, Math.PI), P);
      const c = new THREE.Mesh(new THREE.PlaneGeometry(2*r, o.h), CUT);
      m.castShadow = true; g.add(m, c);
      lie = r;
    } else {
      const r = o.dims.r;
      const m = new THREE.Mesh(new THREE.SphereGeometry(r, 24, 16, side > 0 ? 0 : Math.PI, Math.PI), P);
      const c = new THREE.Mesh(new THREE.CircleGeometry(r, 24), CUT);
      m.castShadow = true; g.add(m, c);
      lie = r;
    }
    g.position.set(o.x, cy, 0);
    world.add(g);
    halves.push({g, side, up:o.h/2, lie, vx:K.vx*0.25 + R(-0.3,0.4), vy:R(1.2,2.6), vz:side*R(1.4,2.4), vr:side*R(4,6.5), t:0});
  }
}

function slice(o){
  o.alive = false;
  world.remove(o.mesh); o.mesh.geometry.dispose();
  makeHalves(o);
  levelCoins++;
  hud();
  pop(o.x, o.y0 + o.h/2 + 0.4, '+1');
  burst(o.x, o.y0 + o.h/2);
  sfx.slice();
  shake = Math.max(shake, 0.07);
}

// ---------- knife physics ----------
function tap(){
  au();
  if (mode === 'menu') { mode = 'play'; overlay(''); }
  else if (mode === 'fail') { buildLevel(level); mode = 'play'; overlay(''); return; }
  else if (mode === 'win') { if (winTimer > 0.6) nextLevel(); return; }
  if (mode !== 'play' || K.state === 'done') return;
  K.state = 'fly'; K.vy = JUMP_VY; K.vx = JUMP_VX; K.va = SPIN;
  sfx.flip();
}

function stick(p, side, tip){
  const speed = Math.hypot(K.vx, K.vy);
  K.state = 'stuck'; K.vx = K.vy = K.va = 0;
  K.stickT = 0; K.wob = clamp(speed*0.022, 0.06, 0.22) * (Math.random() < 0.5 ? -1 : 1);
  if (side) K.x += (p.x0 + STICK_DEPTH) - tip[0];
  else K.y += (p.top - STICK_DEPTH) - tip[1];
  sfx.stick(); shake = Math.max(shake, 0.1);
  if (p.mult) finish(p.mult);
}

function sideBounce(p, px){
  const left = (px - p.x0) < (p.x1 - px);
  K.vx = left ? -Math.abs(K.vx)*0.4 - 1 : Math.abs(K.vx)*0.4 + 1;
  K.x += left ? -0.04 : 0.04;
  sfx.bonk();
}

// knife hit an object with the handle or the blunt side: push out along the shallowest axis and bounce
function solidHit(o, q){
  const l = q[0] - (o.x - o.w/2), r = (o.x + o.w/2) - q[0], b = q[1] - o.y0, t = (o.y0 + o.h) - q[1];
  const m = Math.min(l, r, b, t);
  if (m === t)      { K.y += t + 0.005; K.vy = Math.max(4.2, -K.vy*0.4); K.vx *= 0.7; }
  else if (m === l) { K.x -= l + 0.005; K.vx = -Math.max(1.6, Math.abs(K.vx)*0.45); K.vy = Math.max(K.vy, 3.2); }
  else if (m === r) { K.x += r + 0.005; K.vx = Math.max(1.6, Math.abs(K.vx)*0.45); }
  else              { K.y -= b + 0.005; K.vy = Math.min(K.vy, -1); }
  K.va = clamp(-K.va*0.4, -7, 7);
  hitCD = 0.06;
  o.sq = 1;
  if (o.steel) { sfx.clang(); shake = Math.max(shake, 0.14); pop(q[0], q[1] + 0.5, 'CLANG!', '#ffd0d0'); }
  else { sfx.bonk(); shake = Math.max(shake, 0.06); }
}

function stepKnife(dt){
  K.vy += G*dt; K.x += K.vx*dt; K.y += K.vy*dt;
  K.va = BASE_SPIN + (K.va - BASE_SPIN)*Math.exp(-3.2*dt);
  K.a += K.va*dt;

  // objects: only the sharp edge (or a straight stab with the tip) cuts; everything else is solid
  const bx = -Math.sin(K.a), by = Math.cos(K.a);   // blade direction
  const nx = by, ny = -bx;                          // edge normal (local +x)
  for (let i = 0; i <= 12; i++) {
    const ly = -0.92 + i*(2.04/12);
    const q = wp(0, ly);
    for (const o of slices) {
      if (!o.alive || !inBox(q[0], q[1], o)) continue;
      if (ly > -0.08) {
        const pvx = K.vx - K.va*ly*by, pvy = K.vy + K.va*ly*bx;
        const edge = pvx*nx + pvy*ny, stab = pvx*bx + pvy*by;
        if (edge > 0.4 || (ly > 0.75 && stab > 2.5)) { slice(o); continue; }
      }
      if (hitCD <= 0) { solidHit(o, q); return; }
    }
    if (hitCD <= 0) for (const o of obstacles) if (inBox(q[0], q[1], o)) { solidHit(o, q); return; }
  }

  const tip = wp(TIP.x, TIP.y), he = wp(HE.x, HE.y);
  const dirx = bx, diry = by;
  let p = platHit(tip[0], tip[1]);
  if (p) {
    const depth = p.top - tip[1];
    if (depth < 0.7) {
      if (K.vy <= 0) {
        if (diry < -0.25) return stick(p, false, tip);
        K.y += depth; K.vy = 3.5; K.vx *= 0.5; sfx.bonk();
      }
    } else if (dirx > 0.3 && tip[0] - p.x0 < 0.6) return stick(p, true, tip);
    else sideBounce(p, tip[0]);
  }
  p = platHit(he[0], he[1]);
  if (p) {
    const depth = p.top - he[1];
    if (depth < 0.7) {
      if (K.vy <= 0) { K.y += depth; K.vy = 6.5; K.vx = -1.2; K.va = -10; sfx.bonk(); shake = Math.max(shake, 0.05); }
    } else sideBounce(p, he[0]);
  }
  const mid = wp(0, 0.1);
  p = platHit(mid[0], mid[1]);
  if (p) {
    const depth = p.top - mid[1];
    if (depth < 0.7) { if (K.vy <= 0) { K.y += depth + 0.01; K.vy = 4; } }
    else sideBounce(p, mid[0]);
  }
}

// rotate the knife about its tip (keeps the tip planted)
function setAngleAboutTip(a){
  const t = wp(TIP.x, TIP.y);
  K.a = a;
  const t2 = wp(TIP.x, TIP.y);
  K.x += t[0] - t2[0]; K.y += t[1] - t2[1];
}

function physics(dt){
  hitCD -= dt;
  if (K.state === 'fly') {
    stepKnife(dt);
    if (K.y < -11 && mode === 'play') fail();
  } else if (K.state === 'stuck' || K.state === 'done') {
    // ease a steep landing toward a natural lean
    K.stickT += dt;
    let a = ((K.a % (2*Math.PI)) + 2*Math.PI) % (2*Math.PI);
    const tilt = a - Math.PI, target = clamp(tilt, -MAX_TILT, MAX_TILT);
    if (Math.abs(tilt - target) > 1e-4) setAngleAboutTip(Math.PI + tilt + (target - tilt)*Math.min(1, dt*10));
  }
}
// ---------- game flow ----------
function finish(mult){
  K.state = 'done';
  lastMult = mult;
  const earned = levelCoins * mult;
  totalCoins += earned;
  level++; save();
  mode = 'win'; winTimer = 0;
  pop(K.x, K.y + 1.5, 'x' + mult, '#ffe14d');
  sfx.win();
  setTimeout(() => overlay(`<div class="big">LEVEL COMPLETE!</div>
    <div class="mid">${levelCoins} sliced &times; ${mult} = +${earned}</div>
    <div class="hint">Tap to continue</div>`, true), 500);
  hud();
}
function nextLevel(){ buildLevel(level); mode = 'play'; overlay(''); }
function fail(){
  mode = 'fail'; K.state = 'dead';
  sfx.fail();
  overlay(`<div class="big">MISSED!</div><div class="hint">Tap to retry</div>`, true);
}

function overlay(html, dim){
  const o = document.getElementById('overlay');
  o.innerHTML = html; o.classList.toggle('dim', !!dim && !!html);
}
function hud(){
  document.getElementById('ct').textContent = totalCoins;
  document.getElementById('lc').textContent = levelCoins ? `sliced: ${levelCoins}` : '';
  const lv = mode === 'win' ? level - 1 : level;
  document.getElementById('l1').textContent = lv;
  document.getElementById('l2').textContent = lv + 1;
}

// ---------- update ----------
const smooth = (cur, target, rate, dt) => cur + (target - cur)*(1 - Math.exp(-rate*dt));

function update(dt){
  // fixed-rate physics so the knife moves the same at any frame rate
  acc += dt;
  while (acc >= STEP) { acc -= STEP; physics(STEP); }
  if (mode === 'win') winTimer += dt;

  // unsupported objects drop onto whatever is below
  for (const o of slices) {
    if (!o.alive) continue;
    const floor = floorOf(o);
    if (o.y0 > floor + 1e-4 || o.vy) {
      o.vy += G*dt; o.y0 += o.vy*dt;
      if (o.y0 <= floor) {
        if (o.vy < -3) o.sq = Math.min(1, -o.vy*0.08);
        o.y0 = floor; o.vy = 0;
      }
      o.mesh.position.y = o.y0 + o.h/2;
    }
    if (o.sq > 0.001) {
      o.sq *= Math.exp(-7*dt);
      const s = Math.sin(o.sq*14)*o.sq*0.12;
      o.mesh.scale.set(1 + s, 1 - s, 1 + s);
    }
  }

  // cut halves
  for (let i = halves.length - 1; i >= 0; i--) {
    const h = halves[i], g = h.g;
    h.vy += G*0.7*dt;
    g.position.x += h.vx*dt; g.position.y += h.vy*dt; g.position.z += h.vz*dt;
    if (h.vr) {
      g.rotation.x += h.vr*dt;
      if (Math.abs(g.rotation.x) >= Math.PI/2) { g.rotation.x = Math.sign(g.rotation.x)*Math.PI/2; h.vr = 0; }
    }
    const p = platAt(g.position.x);
    if (p && Math.abs(g.position.z) < PLAT_D/2 + 0.2) {
      const k = Math.abs(g.rotation.x)/(Math.PI/2);
      const off = h.up + (h.lie - h.up)*k;
      if (g.position.y - off < p.top && g.position.y - off > p.top - 1) {
        g.position.y = p.top + off;
        h.vy = 0; h.vx *= Math.exp(-3*dt); h.vz *= Math.exp(-3*dt);
        if (h.vr) h.vr = h.side * Math.max(Math.abs(h.vr), 4);
      }
    }
    if (g.position.y < -20 || g.position.x < camX - 25) {
      world.remove(g); g.traverse(c => c.geometry && c.geometry.dispose());
      halves.splice(i, 1);
    }
  }

  // particles
  for (let i = parts.length - 1; i >= 0; i--) {
    const q = parts[i];
    q.life -= dt; q.vy += G*0.6*dt;
    q.m.position.x += q.vx*dt; q.m.position.y += q.vy*dt; q.m.position.z += q.vz*dt;
    q.m.rotation.x += 8*dt; q.m.rotation.y += 6*dt;
    q.m.scale.setScalar(Math.max(0.01, q.life/0.7));
    if (q.life <= 0) { world.remove(q.m); parts.splice(i, 1); }
  }

  // knife: a damped wobble around the planted tip after it sticks
  let ra = K.a;
  if (K.state !== 'fly' && K.stickT < 2) ra += K.wob*Math.exp(-7*K.stickT)*Math.sin(K.stickT*32);
  const tip = wp(TIP.x, TIP.y), c = Math.cos(ra), s = Math.sin(ra);
  knifeMesh.position.set(tip[0] - (TIP.x*c - TIP.y*s), tip[1] - (TIP.x*s + TIP.y*c), 0);
  knifeMesh.rotation.z = ra;

  // trail
  if (K.state === 'fly') {
    const a = wp(TIP.x, TIP.y), b = wp(0, 0.35);
    trail.pts.push([a[0], a[1], b[0], b[1]]);
    if (trail.pts.length > TRAIL_N) trail.pts.shift();
    trail.mat.uniforms.op.value = smooth(trail.mat.uniforms.op.value, Math.min(1, Math.abs(K.va)/10 + 0.25), 12, dt);
  } else {
    trail.mat.uniforms.op.value = smooth(trail.mat.uniforms.op.value, 0, 14, dt);
    if (trail.pts.length > 1 && trail.mat.uniforms.op.value < 0.02) trail.pts.length = 0;
  }
  const pos = trail.geo.attributes.position.array, n = trail.pts.length;
  for (let i = 0; i < TRAIL_N; i++) {
    const pt = n ? trail.pts[Math.max(0, n - TRAIL_N + i)] : [K.x, K.y, K.x, K.y];
    pos.set([pt[0], pt[1], 0, pt[2], pt[3], 0], i*6);
  }
  trail.geo.attributes.position.needsUpdate = true;

  // camera: smooth follow with a little look-ahead
  if (mode !== 'fail') camX = smooth(camX, K.x + (K.state === 'fly' ? K.vx*0.12 : 0), 4, dt);
  const ty = mode === 'fail' ? camY : clamp(K.y, -2, 30)*0.6;
  camY = smooth(camY, ty, 2.5, dt);
  const portrait = camera.aspect < 1;
  const dist = portrait ? 10.5 + (1 - camera.aspect)*12 : 10.5;
  shake *= Math.exp(-9*dt); shakeT += dt;
  const sx = Math.sin(shakeT*53)*shake*0.5, sy = Math.cos(shakeT*47)*shake*0.5;
  camera.position.set(camX + 0.5 + sx, camY + 4.2 + (portrait ? 1.5 : 0) + sy, dist);
  camera.lookAt(camX + (portrait ? 2 : 3.2), camY + 0.6, 0);
  sun.position.set(camX + 6, camY + 16, 10);
  sun.target.position.set(camX + 2, camY, 0);
  water.position.x = camX;

  const prog = clamp((K.x - startX)/(finishX - startX), 0, 1);
  document.getElementById('fill').style.width = (prog*100).toFixed(1) + '%';
}
let last = performance.now();
function loop(now){
  const dt = Math.min(1/30, (now - last)/1000); last = now;
  update(dt);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

// ---------- input ----------
addEventListener('pointerdown', e => { e.preventDefault(); tap(); });
addEventListener('keydown', e => { if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'Enter') { e.preventDefault(); if (!e.repeat) tap(); } });

buildLevel(level);
overlay(`<div class="big">SLICE IT ALL</div><div class="mid">Carter Edition</div>
  <div class="hand">👆</div><div class="hint">Tap / Space to flip</div>`, true);
requestAnimationFrame(loop);
</script>
</body>
</html>
